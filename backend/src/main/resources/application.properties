spring.application.name=pioneer_app
server.port=8080

# ===============================
# 비밀 값은 저장소에 넣지 않는다.
# 로컬: backend/local.properties (git 무시됨, local.properties.example 참고)
# 배포: 같은 이름의 환경변수 DB_PASSWORD, CLUB_PASSWORD
spring.config.import=optional:file:./local.properties

# ===============================
# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/pioneer?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=pioneer
spring.datasource.password=${DB_PASSWORD}

# ===============================
# JPA (개발 중에는 update, 배포 시 validate 권장)
spring.jpa.hibernate.ddl-auto=update
# 실행되는 SQL을 보고 싶을 때만 true로 바꾸기
spring.jpa.show-sql=false
# DB 조회는 컨트롤러/서비스 안에서 끝내고, 화면 응답 중에는 DB를 열어두지 않음
spring.jpa.open-in-view=false

# ===============================
# 로그인 계정 기능을 쓰지 않으므로 Spring Security의 임시 계정(generated password) 생성을 끔
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# ===============================
# 과제 첨부 파일 저장 위치
app.upload-dir=./uploads

# ===============================
# 동아리 입장 비밀번호 (기본값 없음: 설정하지 않으면 서버가 시작되지 않음)
app.club-password=${CLUB_PASSWORD}

# 한 번 입장하면 30일 동안 유지
server.servlet.session.timeout=30d
server.servlet.session.cookie.max-age=30d

# 과제 파일 첨부 크기 제한
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
