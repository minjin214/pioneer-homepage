spring.application.name=pioneer_app

# ?? ??
server.port=8080

# ===============================
# MySQL ?????? ??
spring.datasource.url=jdbc:mysql://localhost:3306/pioneer?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=pioneer
spring.datasource.password=${DB_PASSWORD}

# ===============================
# JPA ??
# ??? update, ?? ? validate? ?? ??
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# ?? ??? ??
app.upload-dir=./uploads

# ===============================
# 동아리 입장 비밀번호 (환경변수 CLUB_PASSWORD로 바꿀 수 있음, 기본값은 로컬 개발용)
app.club-password=${CLUB_PASSWORD}

# 한 번 입장하면 30일 동안 유지
server.servlet.session.timeout=30d
server.servlet.session.cookie.max-age=30d

# 과제 파일 첨부 크기 제한
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
